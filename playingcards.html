<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Playing Cards</title>
  <link rel="stylesheet" href="playingcards.css" />
</head>
<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">A♠</div>
      <div class="middle">
        <div>♠</div>
        <div>Spade</div>
      </div>
      <div class="right">A♠</div>
    </div>
    <div class="card">
      <div class="left">K♥</div>
      <div class="middle">
        <div>♥</div>
        <div>Heart</div>
      </div>
      <div class="right">K♥</div>
    </div>
    <div class="card">
      <div class="left">Q♦</div>
      <div class="middle">
        <div>♦</div>
        <div>Diamond</div>
      </div>
      <div class="right">Q♦</div>
    </div>
  </main>
</body>
</html>
