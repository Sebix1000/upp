<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Checkout page</title>
    </head>
    <body>
        <h1>Checkout</h1>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/spoon.jpg" alt="łyżka">
        <p>Left-handed spoon</p>
        <p>$29.99</p>
        <form method="POST">
            <h2>Payment Information</h2>
            <label for="card">Cardholder Name</label>
            <input type="text" id="card"> <br>
            <label for="cardn">Card Number</label>
            <input type="number" id="cardn"><br>
            <label for="exp">Expiry Date</label>
            <input type="text" placeholder="MM/YY"> <br>
            <label for="cvv">CVV</label>
            <input type="number" id="cvv"> <br>
            <input type="submit" value="Place Order">
        </form>
    </body>
</html>
