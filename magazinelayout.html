<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Custom Magazine</title>
  <link rel="stylesheet" href="magazinelayout.css" />
</head>
<body>

  <main class="magazine-cover">
    <header class="title">
      <h1>Urban Style Monthly</h1>
    </header>

    <section class="feature-article">
      <h2>Exclusive Interview</h2>
      <p>Meet the designer changing the city's look...</p>
    </section>

    <section class="small-article1">
      <h3>Trends to Watch</h3>
      <p>Top 5 streetwear trends this season.</p>
    </section>

    <section class="small-article2">
      <h3>City Hotspots</h3>
      <p>Hidden gems for fashion shoots.</p>
    </section>

    <section class="cover-image">
      <img src="https://picsum.photos/400/600" alt="Fashion Cover" />
    </section>
  </main>

</body>
</html>
